# TEMPLATE — move to the repository root `.github/workflows/` to activate.
# Runs the weekly agentic assembly and opens a PR against eigenius/online.
# See design §4, §8, §9.
name: radar-assemble

on:
  schedule:
    - cron: "0 13 * * 1" # weekly, Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # TODO: restore the archive, rebuild the index, then assemble
      - run: deno task assemble
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

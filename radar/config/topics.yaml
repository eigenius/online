# Topic taxonomy + anchors. `keywords` drive the cheap relevance
# gate; `anchors` prime the embedding centroid and the LLM relevance rubric.
topics:
  - key: agentic-ai
    label: AI Scientists & AI Engineers
    keywords: [
      AI scientist,
      AI engineer,
      autonomous research,
      agentic workflows,
      code synthesis,
      self-driving lab,
      lab automation,
    ]
    anchors:
      - "Autonomous or AI-assisted scientific research and software engineering: hypothesis generation, agentic coding workflows, experiment design, and lab automation."

  - key: neurosymbolic
    label: Neurosymbolic & Hybrid AI
    keywords: [
      neurosymbolic,
      neuro-symbolic,
      program synthesis,
      knowledge graph,
      symbolic reasoning,
      hybrid AI,
    ]
    anchors:
      - "Combining neural networks with symbolic reasoning, knowledge graphs, or structured logic to improve reasoning and robustness."

  - key: formal-rigor
    label: Formal Methods & Verified Science
    keywords: [
      formal verification,
      formal methods,
      Lean,
      Coq,
      Isabelle,
      theorem proving,
      verified output,
      machine-checkable,
      reproducibility,
    ]
    anchors:
      - "Applying theorem proving, model checking, and formal methods to verify AI outputs, or making scientific and engineering claims machine-checkable and auditable."

  - key: ai-life-sciences
    label: AI in Life Sciences & Medicine
    keywords: [
      protein,
      drug discovery,
      molecule,
      clinical,
      genomics,
      comp-bio,
    ]
    anchors:
      - "AI applied to biology and medicine: protein/molecule models, drug discovery, clinical reasoning, and genomic analysis."

# Source registry (design §3). Each entry becomes a SourceAdapter via
# src/sources/registry.ts. Adding a source is one entry here.
# Feeds researched 2026-07 — see docs/sources.txt and the trailing topic notes.
sources:
  - id: arxiv
    kind: arxiv
    categories: [cs.AI, cs.LG, cs.LO, cs.SC, cs.PL, cs.SE, math.LO, stat.ML]
    maxResults: 50

  # ---- Preprint & community APIs ----
  - id: biorxiv
    kind: biorxiv
    server: biorxiv
    days: 2
    maxResults: 300 # no query API — the topic gate keeps only the AI-in-bio ones
  # medRxiv (clinical preprints) — enable if life-sciences coverage wants it:
  # - { id: medrxiv, kind: biorxiv, server: medrxiv, days: 2, maxResults: 200 }
  - id: hacker-news
    kind: hacker_news
    minPoints: 25
    queries:
      - neurosymbolic
      - theorem proving
      - formal verification
      - AI drug discovery
      - AI for science
      - protein design

  # ---- Industry (company / lab blogs) ----
  - {
      id: deepmind-blog,
      kind: rss,
      url: "https://deepmind.google/blog/rss.xml",
      sourceKind: industry,
    } # ai-scientist, ai-life-sciences
  - {
      id: sakana-ai,
      kind: rss,
      url: "https://sakana.ai/feed.xml",
      sourceKind: industry,
    } # ai-scientist
  - {
      id: valence-labs,
      kind: rss,
      url: "https://valencelabs.substack.com/feed",
      sourceKind: industry,
    } # ai-life-sciences, ai-scientist
  - {
      id: aws-automated-reasoning,
      kind: rss,
      url: "https://aws.amazon.com/blogs/security/tag/automated-reasoning/feed/",
      sourceKind: industry,
    } # formal-verification, formal-methods
  # Galois — https://galois.com/blog/ — formal-methods, formal-verification
  #   The feed advertised in the site footer (https://galois.com/feed/) returns
  #   404 — it's broken on their end. Harvest via Google PSE site: discovery
  #   instead once that's wired.

  # ---- News & analysis ----
  - {
      id: sigplan,
      kind: rss,
      url: "https://blog.sigplan.org/feed/",
      sourceKind: news,
    } # formal-methods, formal-verification
  - {
      id: quanta-ai,
      kind: rss,
      url: "https://www.quantamagazine.org/tag/artificial-intelligence/feed/",
      sourceKind: news,
    } # neurosymbolic, formal-methods, ai-scientist
  - {
      id: nature-ml,
      kind: rss,
      url: "https://www.nature.com/subjects/machine-learning.rss",
      sourceKind: news,
    } # ai-life-sciences, ai-scientist
  - {
      id: mit-tech-review-ai,
      kind: rss,
      url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/",
      sourceKind: news,
    } # ai-scientist, ai-life-sciences
  - {
      id: import-ai,
      kind: rss,
      url: "https://importai.substack.com/feed",
      sourceKind: news,
    } # ai-scientist, verified-science

  # ---- Opinion (individual blogs / Substacks) ----
  - {
      id: terence-tao,
      kind: rss,
      url: "https://terrytao.wordpress.com/feed/",
      sourceKind: opinion,
    } # formal-methods, formal-verification
  - {
      id: xena-project,
      kind: rss,
      url: "https://xenaproject.wordpress.com/feed/",
      sourceKind: opinion,
    } # formal-methods, formal-verification
  - {
      id: argmin,
      kind: rss,
      url: "https://www.argmin.net/feed",
      sourceKind: opinion,
    } # verified-science
  - {
      id: gary-marcus,
      kind: rss,
      url: "https://garymarcus.substack.com/feed",
      sourceKind: opinion,
    } # neurosymbolic, verified-science
  - {
      id: sebastian-raschka,
      kind: rss,
      url: "https://magazine.sebastianraschka.com/feed",
      sourceKind: opinion,
    } # ai-life-sciences, ai-scientist
  - {
      id: simon-willison,
      kind: rss,
      url: "https://simonwillison.net/atom/entries/",
      sourceKind: opinion,
    } # ai-scientist
  - {
      id: francois-chollet,
      kind: rss,
      url: "https://fchollet.substack.com/feed",
      sourceKind: opinion,
    } # neurosymbolic, ai-scientist

